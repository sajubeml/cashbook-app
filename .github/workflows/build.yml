name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build CashBook APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake \
            libffi-dev libssl-dev libjpeg-dev libpng-dev ccache \
            build-essential python3-dev \
            libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
            curl wget

      - name: Install Buildozer and Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install "cython<3.0" virtualenv
          pip install buildozer

      - name: Clone and Configure python-for-android
        run: |
          mkdir -p .buildozer/android/platform
          git clone --depth=1 -b master \
            https://github.com/kivy/python-for-android.git \
            .buildozer/android/platform/python-for-android

          # Patch all recipes in python-for-android to fix broken/unreliable download URLs
          python3 -c "
          import os, glob

          recipes_dir = '.buildozer/android/platform/python-for-android/pythonforandroid/recipes'
          for root, dirs, files in os.walk(recipes_dir):
              for f in files:
                  if f == '__init__.py':
                      path = os.path.join(root, f)
                      with open(path, 'r', encoding='utf-8', errors='ignore') as fp:
                          content = fp.read()
                      new_content = content
                      # Replace Savannah mirror with SourceForge for FreeType
                      new_content = new_content.replace('https://download.savannah.gnu.org/releases/freetype/', 'https://downloads.sourceforge.net/project/freetype/freetype2/')
                      new_content = new_content.replace('https://download.nongnu.org/releases/freetype/', 'https://downloads.sourceforge.net/project/freetype/freetype2/')
                      if new_content != content:
                          with open(path, 'w', encoding='utf-8') as fp:
                              fp.write(new_content)
                          print(f'Patched: {path}')
          "

      - name: Pre-download FreeType Tarballs
        run: |
          mkdir -p ~/.buildozer/cache
          for ver in 2.10.4 2.11.1 2.13.2; do
            curl -fsSL --retry 3 "https://downloads.sourceforge.net/project/freetype/freetype2/${ver}/freetype-${ver}.tar.gz" -o ~/.buildozer/cache/freetype-${ver}.tar.gz || true
          done
          ls -lh ~/.buildozer/cache/

      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.android
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}-v3
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: Compile APK with Buildozer
        run: |
          set -o pipefail
          buildozer android debug 2>&1 | tee buildozer_full.log
        timeout-minutes: 45

      - name: Upload Error Log on Failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Buildozer-Error-Log
          path: buildozer_full.log
          if-no-files-found: warn

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: CashBook-Android-APK
          path: bin/*.apk
          if-no-files-found: warn
