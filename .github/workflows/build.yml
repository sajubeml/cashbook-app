name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build CashBook APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake \
            libffi-dev libssl-dev libjpeg-dev libpng-dev ccache \
            build-essential python3-dev \
            libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
            curl wget

      - name: Install Buildozer and Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install "cython<3.0" virtualenv
          pip install buildozer

      - name: Pre-download FreeType (bypass Savannah downtime)
        run: |
          mkdir -p ~/.buildozer/cache
          FREETYPE_VERSION="2.13.2"
          FREETYPE_FILE="freetype-${FREETYPE_VERSION}.tar.gz"
          MIRRORS=(
            "https://downloads.sourceforge.net/project/freetype/freetype2/${FREETYPE_VERSION}/${FREETYPE_FILE}"
            "https://github.com/freetype/freetype/archive/refs/tags/VER-${FREETYPE_VERSION//./-}.tar.gz"
            "https://mirror.freedif.org/GNU/freetype/${FREETYPE_FILE}"
          )
          for URL in "${MIRRORS[@]}"; do
            echo "Trying: $URL"
            if curl -fsSL --retry 3 --retry-delay 5 -o ~/.buildozer/cache/${FREETYPE_FILE} "$URL"; then
              echo "Downloaded FreeType from $URL"
              break
            fi
          done
          ls -lh ~/.buildozer/cache/ || echo "Cache empty"

      - name: Clone and Configure python-for-android
        run: |
          mkdir -p .buildozer/android/platform
          git clone --depth=1 -b master \
            https://github.com/kivy/python-for-android.git \
            .buildozer/android/platform/python-for-android

          P4A_DIR=".buildozer/android/platform/python-for-android"

          FREETYPE_RECIPE="${P4A_DIR}/pythonforandroid/recipes/freetype/__init__.py"
          if [ -f "$FREETYPE_RECIPE" ]; then
            sed -i \
              's|https://download.savannah.gnu.org/releases/freetype/freetype-{version}.tar.gz|https://downloads.sourceforge.net/project/freetype/freetype2/{version}/freetype-{version}.tar.gz|g' \
              "$FREETYPE_RECIPE"
            sed -i \
              's|https://download.nongnu.org/releases/freetype/freetype-{version}.tar.gz|https://downloads.sourceforge.net/project/freetype/freetype2/{version}/freetype-{version}.tar.gz|g' \
              "$FREETYPE_RECIPE"
            echo "FreeType recipe patched:"
            grep -n "url" "$FREETYPE_RECIPE" | head -5
          fi

      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.android
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}-v2
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: Compile APK with Buildozer
        run: |
          ~/.local/bin/buildozer android debug 2>&1 | tee buildozer_full.log || \
          buildozer android debug 2>&1 | tee buildozer_full.log
        timeout-minutes: 45

      - name: Upload Error Log on Failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Buildozer-Error-Log
          path: buildozer_full.log
          if-no-files-found: warn

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: CashBook-Android-APK
          path: bin/*.apk
          if-no-files-found: error
