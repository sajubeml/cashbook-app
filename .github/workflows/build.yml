name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build CashBook APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake \
            libffi-dev libssl-dev libjpeg-dev libpng-dev ccache \
            build-essential python3 python3-pip python3-dev \
            libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev

      - name: Install Buildozer
        run: |
          python3 -m pip install --upgrade pip
          pip3 install --user --upgrade buildozer "cython<3.0" virtualenv

      - name: Patch FreeType Download URL
        run: |
          # Savannah is frequently down (502/504 errors). We will download FreeType using curl.
          mkdir -p ~/.buildozer/cache
          curl -fSL "https://downloads.sourceforge.net/project/freetype/freetype2/2.14.1/freetype-2.14.1.tar.gz" -o ~/.buildozer/cache/freetype-2.14.1.tar.gz
          cd ~/.buildozer/cache
          python3 -m http.server 8000 &
          cd $GITHUB_WORKSPACE
          
          # Clone python-for-android manually to patch it
          mkdir -p .buildozer/android/platform
          git clone -b master --single-branch https://github.com/kivy/python-for-android.git .buildozer/android/platform/python-for-android
          
          # Patch the freetype recipe to use our local server
          sed -i 's|https://download.savannah.gnu.org/releases/freetype/freetype-{version}.tar.gz|http://localhost:8000/freetype-{version}.tar.gz|g' .buildozer/android/platform/python-for-android/pythonforandroid/recipes/freetype/__init__.py
          sed -i 's|https://download.nongnu.org/releases/freetype/freetype-{version}.tar.gz|http://localhost:8000/freetype-{version}.tar.gz|g' .buildozer/android/platform/python-for-android/pythonforandroid/recipes/freetype/__init__.py
          
          # Monkey-patch python-for-android to use a browser User-Agent to bypass 403 Forbidden blocks on downloads
          cat << 'EOF' > patch_ua.py
          import urllib.request
          urllib.request.FancyURLopener.version = "Mozilla/5.0 (Windows NT 10.0; Win64; x64)"
          urllib.request.URLopener.version = "Mozilla/5.0 (Windows NT 10.0; Win64; x64)"
          opener = urllib.request.build_opener()
          opener.addheaders = [('User-agent', 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)')]
          urllib.request.install_opener(opener)
          EOF
          cat patch_ua.py .buildozer/android/platform/python-for-android/pythonforandroid/__init__.py > temp.py
          mv temp.py .buildozer/android/platform/python-for-android/pythonforandroid/__init__.py

      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}

      - name: Compile APK with Buildozer
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ~/.local/bin/buildozer android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CashBook-Android-APK
          path: bin/*.apk
          if-no-files-found: warn
